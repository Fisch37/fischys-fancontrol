[package]
name = "fischys-fancontrol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
serde = "1.0.219"
serde_derive = "1.0.219"
typetag = "0.2"
lazy_static="1.5.0"

log = "0.4.28"
systemd-journal-logger = "2.2.2"
simple_logger = { version = "5.0.0", features = ["stderr"] }
chrono = "0.4.42"

regex = "1.11.2"
csv = "1.3.1"
strum = { version = "0.27", features = ["derive"] }

signal-hook="0.3.18"
clap = { version = "4.5.53", features = ["derive"] }

nvml-wrapper = { version = "0.11.0", optional = true }
libsensors-rs = { git = "https://github.com/Fisch37/libsensors-rs.git", optional = true }

hashbrown = ">=0.16"

[features]
all = ["nvml", "libsensors", "sensors-cmd", "nvidia-smi"]
default = ["nvml", "libsensors"]
nvml = ["dep:nvml-wrapper"]
libsensors = ["dep:libsensors-rs"]
sensors-cmd = []
nvidia-smi = []